# Run Supabase CLI commands from driver/v2 so this folder is ./supabase.
project_id = "pidi-driver"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.migrations]
enabled = true

[realtime]
enabled = true

# The phone calls these with the anon key, before it has a user token.
# Each function checks the PIN or the order token itself.
[functions.driver-pin]
verify_jwt = false

[functions.kitchen-pin]
verify_jwt = false

[functions.order-session]
verify_jwt = false
